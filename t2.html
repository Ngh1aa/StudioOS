<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8" />
<link rel="stylesheet" href="http://localhost:8899/styles.css" />
<link rel="stylesheet" href="http://localhost:8899/monochrome-overrides.css" />
</head>
<body>
<aside class="studio-sidebar" id="sidebar" style="height:700px; width:248px;">
  <div class="sidebar-brand">
    <div class="brand-mark-wrap"><img src="http://localhost:8899/assets/logo/studioos-mark-light.svg" width="64" height="64" alt="StudioOS mark" /></div>
    <div class="brand-lockup"><span class="brand-name">StudioOS</span><span class="brand-caption">Creative workspace</span></div>
    <button class="sidebar-close only-mobile" id="closeSidebar" type="button" aria-label="Close navigation">X</button>
  </div>
  <button class="workspace-switcher" type="button" data-action="workspace">
    <span class="workspace-avatar">S</span>
    <span class="workspace-copy"><span>StudioOS</span><small>Design workspace</small></span>
    <span data-icon="chevron-down"></span>
  </button>
  <nav class="side-nav" aria-label="Primary navigation">
    <span class="nav-section-label">Workspace</span>
    <button class="side-nav-item active" type="button" data-nav="Overview"><span data-icon="dashboard"></span><span>Overview</span></button>
    <button class="side-nav-item" type="button" data-nav="Projects"><span data-icon="folder"></span><span>Projects</span><em>04</em></button>
    <button class="side-nav-item" type="button" data-nav="Calendar"><span data-icon="calendar"></span><span>Calendar</span></button>
    <button class="side-nav-item" type="button" data-nav="Tasks"><span data-icon="check-circle"></span><span>Tasks</span><em>04</em></button>
    <button class="side-nav-item" type="button" data-nav="Team"><span data-icon="users"></span><span>Team</span></button>
    <button class="side-nav-item" type="button" data-nav="Notes"><span data-icon="inbox"></span><span>Notes</span><em>06</em></button>
    <span class="nav-section-label nav-section-spaced">Manage</span>
    <button class="side-nav-item" type="button" data-nav="Insights"><span data-icon="chart"></span><span>Insights</span></button>
    <button class="side-nav-item" type="button" data-nav="Settings"><span data-icon="settings"></span><span>Settings</span></button>
  </nav>
  <div class="sidebar-bottom">
    <button class="sidebar-toggle" id="sidebarToggle" type="button"><span data-icon="chevron-left"></span><span class="toggle-label">Collapse</span></button>
    <div class="sidebar-profile"><span class="profile-avatar">AT</span><span><strong>Alex Tran</strong><small>Product designer</small></span><span class="profile-more" data-icon="more"></span></div>
  </div>
</aside>
</body>
</html>
